<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>報告書ベース確認 | MOSFET for Satellite</title>
  <link rel="stylesheet" href="../../styles.css">
  <style>
    .preview-shell {
      background: rgba(255, 255, 255, 0.92);
      border: 1px solid #d7e2ee;
      border-radius: 14px;
      box-shadow: 0 8px 24px rgba(10, 38, 58, 0.08);
      padding: 22px;
    }

      margin: 0 0 14px;

    }

    .markdown-body {

      line-height: 1.75;
    }

    .markdown-body h1,
    .markdown-body h2,
    .markdown-body h3 {

      margin-top: 1.2em;
      margin-bottom: 0.45em;
    }

    .markdown-body h1 {
      font-size: 1.85rem;
      margin-top: 0;
    }

    .markdown-body h2 {
      font-size: 1.35rem;
      border-bottom: 1px solid #dbe6ef;
      padding-bottom: 0.2em;
    }

    .markdown-body ul,
    .markdown-body ol {
      padding-left: 1.35rem;
    }

    .markdown-body table {
      width: 100%;
      border-collapse: collapse;
      margin: 8px 0 12px;
      font-size: 0.94rem;
    }

    .markdown-body th,
    .markdown-body td {
      border: 1px solid #d5e1ed;
      padding: 8px 10px;
      text-align: left;
      vertical-align: top;
    }

    .markdown-body th {
      background: #edf5fb;
    }

      border-top: 1px solid #dbe6ef;
      margin: 18px 0;
    }
  </style>
</head>
<body class="content-page">
  <main class="page-body">
    <div class="preview-shell">
      <p class="preview-note">`report_base.md` を読み込んで表示します。読み込み不可環境では埋め込みテンプレートを表示します。</p>
      <article class="markdown-body" id="markdownBody">Loading...</article>
    </div>
  </main>

  <script>
    const EMBEDDED_MARKDOWN = `# 市場調査報告書（ベーステンプレート）

## 6. 考察
### 6.1 主要示唆
- 示唆1:

## 7. 結論

- 条件付き事項:

## 8. 課題・次アクション
| 課題 | 優先度 | 担当 | 期限 | 完了条件 |

| 例: 放射線試験計画策定 | High | 山田 | 2026-03-15 | 計画書レビュー完了 |

## 9. 参考資料

更新履歴:

    function escapeHtml(text) {
      return text
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
    }

    function parseInline(text) {
      return escapeHtml(text)
        .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
        .replace(/\*(.+?)\*/g, "<em>$1</em>")
        .replace(/`(.+?)`/g, "<code>$1</code>");
    }

    function renderMarkdown(md) {
      const lines = md.replace(/\r\n/g, "\n").split("\n");
      const html = [];
      let inUl = false;
      let inOl = false;
      let inTable = false;

      function closeLists() {
        if (inUl) {
          html.push("</ul>");
          inUl = false;
        }
        if (inOl) {
          html.push("</ol>");
          inOl = false;
        }
      }

      function closeTable() {
        if (inTable) {
          html.push("</tbody></table>");
          inTable = false;
        }
      }

      for (let i = 0; i < lines.length; i += 1) {
        const line = lines[i];
        const trimmed = line.trim();

        if (trimmed === "") {
          closeLists();
          closeTable();
          continue;
        }

        if (/^\|/.test(trimmed)) {
          closeLists();
          const row = trimmed
            .split("|")
            .slice(1, -1)
            .map((cell) => cell.trim());

          if (!inTable) {
            html.push("<table><thead>");
            html.push(`<tr>${row.map((c) => `<th>${parseInline(c)}</th>`).join("")}</tr>`);
            html.push("</thead><tbody>");
            inTable = true;
            if (i + 1 < lines.length && /^\|\s*[-:]+/.test(lines[i + 1].trim())) {
              i += 1;
            }
          } else {
            html.push(`<tr>${row.map((c) => `<td>${parseInline(c)}</td>`).join("")}</tr>`);
          }
          continue;
        }

        closeTable();

        if (/^###\s+/.test(trimmed)) {
          closeLists();
          html.push(`<h3>${parseInline(trimmed.replace(/^###\s+/, ""))}</h3>`);
          continue;
        }
        if (/^##\s+/.test(trimmed)) {
          closeLists();
          html.push(`<h2>${parseInline(trimmed.replace(/^##\s+/, ""))}</h2>`);
          continue;
        }
        if (/^#\s+/.test(trimmed)) {
          closeLists();
          html.push(`<h1>${parseInline(trimmed.replace(/^#\s+/, ""))}</h1>`);
          continue;
        }

        if (/^\d+\.\s+/.test(trimmed)) {
          if (!inOl) {
            closeLists();
            html.push("<ol>");
            inOl = true;
          }
          html.push(`<li>${parseInline(trimmed.replace(/^\d+\.\s+/, ""))}</li>`);
          continue;
        }

        if (/^-\s+/.test(trimmed)) {
          if (!inUl) {
            closeLists();
            html.push("<ul>");
            inUl = true;
          }
          html.push(`<li>${parseInline(trimmed.replace(/^-\s+/, ""))}</li>`);
          continue;
        }

        if (/^---$/.test(trimmed)) {
          closeLists();
          html.push("<hr>");
          continue;
        }

        closeLists();
        html.push(`<p>${parseInline(trimmed)}</p>`);
      }

      closeLists();
      closeTable();
      return html.join("\n");
    }

    async function loadMarkdown() {
      const target = document.getElementById("markdownBody");
      try {
        const response = await fetch("./report_base.md");
        if (!response.ok) {
          target.innerHTML = renderMarkdown(EMBEDDED_MARKDOWN);
          return;
        }
        const md = await response.text();
        target.innerHTML = renderMarkdown(md);
      } catch (error) {
        target.innerHTML = renderMarkdown(EMBEDDED_MARKDOWN);
      }
    }

    loadMarkdown();
  </script>
</body>
</html>
